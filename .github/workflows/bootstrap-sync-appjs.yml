# TEMPORARY one-time helper. Copies the live app.js into this branch after checking its sha256.
# Removed again before merge.
name: One-time sync app.js from live

on:
  push:
    branches:
      - sync-live
    paths:
      - .github/workflows/bootstrap-sync-appjs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-live
      - name: Copy live app.js and verify hash
        run: |
          set -euo pipefail
          curl -fsSL "https://sparkkeys.web.app/app.js?v=20261004a" -o /tmp/app.js
          echo "67f6acc62db2a42548bb0cdc123a511a6e215b462dc600a42df0bd79f10fde9d  /tmp/app.js" | sha256sum -c -
          cp /tmp/app.js app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Sync app.js from live (sha256 67f6acc6 verified)"
          git push origin HEAD:sync-live
